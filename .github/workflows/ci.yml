# Supply-chain hygiene: every action is pinned to a commit SHA (the matching tag is in the comment), the job
# container and the database service images to their manifest-list digests, so a moved tag cannot change what runs
# here. The job token is read-only.
# To update a pin, look up the tag's commit (git ls-remote --tags https://github.com/<owner>/<repo>) or the image
# digest (docker buildx imagetools inspect mariadb:11.4 --format '{{.Manifest.Digest}}') and change the SHA and the
# comment together. The database digests of 10.11 and 11.4 were read on 2026-10-02, the one of 12.3 on 2026-10-04;
# refresh them now and then, so that the tests keep running against current patch releases (a digest also appears in
# the coverage job). Only numeric tags: `latest` and `lts` move to new major versions.
# MariaDB is the only database since 3.0: 10.11 is the oldest supported version (the hosting runs it), 11.4 and
# 12.3 are the later LTS releases.
# PHP 8.6 is not released yet: the test jobs run on its pre-release build as well and may fail there without
# failing the run (continue-on-error). Coverage, static analysis and code style stay on 8.5.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-mariadb:
    runs-on: ubuntu-latest
    container: shivammathur/node:24.04@sha256:ee402d3448af7d680cc697f0cd76f62b04598a527044e38dc4cf1c3404b13071
    name: MariaDB ${{ matrix.mariadb.version }} / PHP ${{ matrix.php }}
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
        mariadb:
          - { version: '10.11', image: 'mariadb:10.11@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab' }
          - { version: '11.4', image: 'mariadb:11.4@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b' }
          - { version: '12.3', image: 'mariadb:12.3@sha256:2bdff1534a7e569fecaf4b10b66ad0d410806e382d9db29ba305448addda97c4' }

    services:
      mariadb:
        image: ${{ matrix.mariadb.image }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: pdo_wrapper_test
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none

      - name: Check the PHP version
        run: |
          php -r 'echo PHP_VERSION, PHP_EOL; exit(str_starts_with(PHP_VERSION, getenv("WANTED") . ".") ? 0 : 1);'
        env:
          WANTED: ${{ matrix.php }}

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 90); do
            mysql -h mariadb -uroot -proot -e "SELECT 1" pdo_wrapper_test >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "MariaDB not ready"; exit 1

      - name: Run all tests
        run: vendor/bin/phpunit --no-coverage
        env:
          MARIADB_HOST: mariadb
          MARIADB_PORT: 3306
          MARIADB_DATABASE: pdo_wrapper_test
          MARIADB_USERNAME: root
          MARIADB_PASSWORD: root

  # innodb_rollback_on_timeout cannot be set at runtime, and a service container takes no server options: this job
  # runs on the runner itself (no job container) and starts the server with docker run, by the same digest as the
  # 10.11 matrix entry. Only the test that needs the option runs here; it is skipped on every other server, so
  # --fail-on-skipped makes sure the option took effect.
  test-rollback-on-timeout:
    runs-on: ubuntu-latest
    name: MariaDB 10.11 with innodb_rollback_on_timeout / PHP 8.5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Start MariaDB with innodb_rollback_on_timeout
        run: |
          docker run -d --name mariadb-rollback-on-timeout -p 127.0.0.1:3306:3306 \
            -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=pdo_wrapper_test \
            mariadb:10.11@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab \
            --innodb-rollback-on-timeout=ON

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 90); do
            docker exec mariadb-rollback-on-timeout mariadb -uroot -proot -e "SELECT 1" pdo_wrapper_test >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "MariaDB not ready"; exit 1

      - name: Run the innodb_rollback_on_timeout test
        run: vendor/bin/phpunit --no-coverage --fail-on-skipped tests/Driver/MariaDb/RollbackOnTimeoutTest.php
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_DATABASE: pdo_wrapper_test
          MARIADB_USERNAME: root
          MARIADB_PASSWORD: root

  # One run with a coverage driver: src/ must stay fully covered. The matrix jobs above run without coverage; this
  # job is what fails when new code arrives without a test.
  coverage:
    runs-on: ubuntu-latest
    container: shivammathur/node:24.04@sha256:ee402d3448af7d680cc697f0cd76f62b04598a527044e38dc4cf1c3404b13071
    name: Coverage (MariaDB 11.4)

    services:
      mariadb:
        image: mariadb:11.4@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: pdo_wrapper_test
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: xdebug

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 90); do
            mysql -h mariadb -uroot -proot -e "SELECT 1" pdo_wrapper_test >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "MariaDB not ready"; exit 1

      - name: Run all tests with coverage
        run: vendor/bin/phpunit --coverage-clover clover.xml
        env:
          XDEBUG_MODE: coverage
          MARIADB_HOST: mariadb
          MARIADB_PORT: 3306
          MARIADB_DATABASE: pdo_wrapper_test
          MARIADB_USERNAME: root
          MARIADB_PASSWORD: root

      - name: Require full statement coverage of src/
        run: |
          php -r '
            $metrics = simplexml_load_file("clover.xml")->project->metrics;
            $total = (int) $metrics["statements"];
            $covered = (int) $metrics["coveredstatements"];
            printf("%d of %d statements covered\n", $covered, $total);
            exit($total > 0 && $covered === $total ? 0 : 1);
          '

  analyse:
    runs-on: ubuntu-latest
    container: shivammathur/node:24.04@sha256:ee402d3448af7d680cc697f0cd76f62b04598a527044e38dc4cf1c3404b13071
    name: Static Analysis

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer analyse

  code-style:
    runs-on: ubuntu-latest
    container: shivammathur/node:24.04@sha256:ee402d3448af7d680cc697f0cd76f62b04598a527044e38dc4cf1c3404b13071
    name: Code Style

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check code style
        run: composer cs
